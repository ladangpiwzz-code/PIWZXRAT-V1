name: devilrat-v1
region: sin
services:
  - name: web
    type: web
    ports:
      - port: 3000
        http: {}
    env:
      - name: NODE_ENV
        value: production
    routes:
      - path: /
        service: web
        port: 3000
    scaling:
      min: 1
      max: 1
    health_checks:
      http:
        path: /health
        port: 3000
        interval: 30s
        timeout: 5s
